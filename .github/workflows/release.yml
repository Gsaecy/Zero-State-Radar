name: release

# 打 tag 即发布：打包预构建 tarball（npm pack），上传成 Release 附件；
# 如果仓库配置了 NPM_TOKEN secret，还会把同一个包发到 npm。
# 附件名固定为 dsh-cyberdeck.tgz，安装 URL 依赖这个固定名：
#   https://github.com/Gsaecy/Zero-State-Radar/releases/latest/download/dsh-cyberdeck.tgz
#
# 常规用法：package.json 的 version 先改好并提交，然后
#   git tag -a v0.1.3 -m "Zero-State Radar v0.1.3" && git push origin v0.1.3
# 想自定义 Release 说明就放 release-notes/<tag>.md（例如 release-notes/v0.1.3.md），
# 没有该文件时用 GitHub 自动生成的变更说明。
#
# 手动重发（修附件、补发说明、补发 npm）：
#   Actions → release → Run workflow，输入已有 tag（例如 v0.1.2）；
#   Release 已存在时只覆盖附件，不会新建 Release；npm 上已存在的版本会跳过。
#
# 为什么还要发 npm：插件市场按「npm 包 > Release tarball > 整仓源码」的顺序安装，
# 大陆网络访问 release-assets.githubusercontent.com 经常失败，而 registry 通常可达
# （DSH 还支持 npmmirror 等 fallback）。发 npm 后市场会优先用 registry 安装。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.2）；留空则用当前 ref'
        required: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="${TAG#v}"
          echo "package.json version: $version, tag: $TAG"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Pack the prebuilt bundle
        run: |
          npm pack
          mv "dsh-cyberdeck-${TAG#v}.tgz" dsh-cyberdeck.tgz
          # 必须是 npm pack 产物（根目录为 package/），否则 pnpm 装不上
          tar -tzf dsh-cyberdeck.tgz > /tmp/tarball-contents.txt
          grep -qx 'package/cordis.patch.yml' /tmp/tarball-contents.txt
          grep -qx 'package/lib/client.js' /tmp/tarball-contents.txt
          ls -l dsh-cyberdeck.tgz
          sha256sum dsh-cyberdeck.tgz

      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dsh-cyberdeck.tgz --clobber
          else
            if [ -f "release-notes/${TAG}.md" ]; then
              gh release create "$TAG" dsh-cyberdeck.tgz \
                --title "Zero-State Radar $TAG" \
                --notes-file "release-notes/${TAG}.md"
            else
              gh release create "$TAG" dsh-cyberdeck.tgz \
                --title "Zero-State Radar $TAG" \
                --generate-notes
            fi
          fi

  npm-publish:
    # 可选：仓库里配了 NPM_TOKEN secret 才会真的发 npm；没配就打印一句跳过。
    # 建议用 npm 的 Automation token（绕过 2FA 交互）。
    needs: release
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "dsh-cyberdeck@${version}" version >/dev/null 2>&1; then
            echo "dsh-cyberdeck@${version} 已经在 npm 上，跳过发布"
          else
            npm publish --access public
          fi

      - name: Skip npm publish (no NPM_TOKEN secret)
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: echo "仓库没有配置 NPM_TOKEN secret，跳过 npm 发布（只发 GitHub Release）"
